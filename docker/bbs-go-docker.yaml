language: zh-CN
port: 8082
allowedOrigins:
  - "*"
installed: false
loginRequired: true

ipLocator:
  ipv4DataPath:
  ipv6DataPath:

idCodec:
  key: 0

logger:
  filename: /app/logs/bbs-go.log
  maxSize: 100
  maxAge: 10
  maxBackups: 10

db:
  type: mysql
  url:
  maxIdleConns: 50
  maxOpenConns: 200
  logLevel: warn # SQL log level: silent, error, warn, info

calendar:
  baseUrl: https://calendar.bvcportal.com
  timeoutSeconds: 8
  cacheSeconds: 30

search:
  indexPath: /app/data/topic_index
