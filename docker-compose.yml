x-builtin-mysql-env: &builtin-mysql-env
  MYSQL_DATABASE: ${BBSGO_DOCKER_MYSQL_DATABASE:-bbsgo}
  MYSQL_USER: ${BBSGO_DOCKER_MYSQL_USER:-bbsgo}
  MYSQL_PASSWORD: ${BBSGO_DOCKER_MYSQL_PASSWORD:-bbsgo_password}

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      <<: *builtin-mysql-env
      MYSQL_ROOT_PASSWORD: ${BBSGO_DOCKER_MYSQL_ROOT_PASSWORD:-bbsgo_root_password}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u\"$${MYSQL_USER}\" -p\"$${MYSQL_PASSWORD}\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  document-converter:
    image: gotenberg/gotenberg:8.36.0-libreoffice@sha256:88f9cc4a8b9468443220a0b945174c794880c1b6d3d583efba6e2319e509ac92
    restart: unless-stopped
    command:
      - gotenberg
      - "--api-timeout=${BBSGO_DOCUMENT_CONVERTER_TIMEOUT_SECONDS:-300}s"
      # One extra MiB leaves room for multipart framing around a 256 MiB file.
      - --api-body-limit=257MB
      - --api-disable-download-from=true
      - --libreoffice-auto-start=true
      - --libreoffice-max-queue-size=4
      - --libreoffice-deny-private-ips=true
      - --libreoffice-deny-public-ips=true
      - --pdfengines-disable-routes=true
      - --prometheus-disable-collect=true
      - --webhook-disable=true
    networks:
      - document-converter
    user: "1001:1001"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=1g,mode=1777
    cpus: 1.0
    mem_limit: 2g
    pids_limit: 256
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  bbs-go:
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    image: mlogclub/bbs-go:${BBSGO_IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      document-converter:
        condition: service_healthy
    volumes:
      # bbs-go.yaml is stored in /app/data. Keep runtime files on the host
      # so deleting/recreating the container does not reset the install config.
      - ./docker-data/data:/app/data
      - ./docker-data/logs:/app/logs
      - ./docker-data/uploads:/app/res/uploads
    ports:
      - "3000:3000"
    environment:
      BBSGO_ENV: prod
      NODE_ENV: production
      PORT: 3000
      BBSGO_SERVER_URL: http://127.0.0.1:8082
      BBSGO_LOGIN_REQUIRED: "${BBSGO_LOGIN_REQUIRED:-true}"
      BBSGO_DOCUMENT_CONVERTER_URL: http://document-converter:3000
      BBSGO_DOCUMENT_CONVERTER_TIMEOUT_SECONDS: "${BBSGO_DOCUMENT_CONVERTER_TIMEOUT_SECONDS:-300}"
      BBSGO_DOCUMENT_PREVIEW_MAX_OUTPUT_MB: "${BBSGO_DOCUMENT_PREVIEW_MAX_OUTPUT_MB:-256}"
      BBSGO_INSTALL_DOCKER_BUILTIN_MYSQL: "true"
      BBSGO_DOCKER_BUILTIN_MYSQL_HOST: mysql
      BBSGO_DOCKER_BUILTIN_MYSQL_PORT: "3306"
      BBSGO_DOCKER_BUILTIN_MYSQL_DATABASE: ${BBSGO_DOCKER_MYSQL_DATABASE:-bbsgo}
      BBSGO_DOCKER_BUILTIN_MYSQL_USERNAME: ${BBSGO_DOCKER_MYSQL_USER:-bbsgo}
      BBSGO_DOCKER_BUILTIN_MYSQL_PASSWORD: ${BBSGO_DOCKER_MYSQL_PASSWORD:-bbsgo_password}
      TZ: Asia/Shanghai
    networks:
      - default
      - document-converter

volumes:
  mysql-data:

networks:
  document-converter:
    internal: true
